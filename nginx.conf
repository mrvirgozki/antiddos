worker_processes 1;
error_log /dev/stdout info;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # =========================================================
    # BASIC ANTI-FLOOD / RATE LIMITING
    # =========================================================

    # Request rate per source IP
    # 10 requests/sec, with a short burst of 20
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    # Simultaneous connections per source IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Return HTTP 429 when request rate is exceeded
    limit_req_status 429;

    # =========================================================
    # TIMEOUTS
    # =========================================================

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    grpc_connect_timeout 10s;
    grpc_send_timeout 3600s;
    grpc_read_timeout 3600s;

    # Protect against slow/incomplete HTTP requests
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;

    # Limit normal HTTP request bodies
    client_max_body_size 10m;

    server {
        listen 8080 http2;
        server_name _;

        # =====================================================
        # BASIC CONNECTION PROTECTION
        # =====================================================

        # Maximum simultaneous connections from one source IP
        limit_conn conn_limit 50;

        # =====================================================
        # VIRGOZKI
        # =====================================================

        location /virgozki {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /virgozki-hu {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /virgozki-xhttp {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================================================
        # VMESS
        # =====================================================

        location /vmess-virgozki {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10003;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /vmess-virgozki-hu {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10004;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /vmess-virgozki-xhttp {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10005;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================================================
        # VLESS
        # =====================================================

        location /vless-virgozki {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10006;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /vless-virgozki-hu {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10007;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /vless-virgozki-xhttp {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10008;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================================================
        # SHADOWSOCKS
        # =====================================================

        location /ss-virgozki {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10009;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /ss-virgozki-hu {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10010;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /ss-virgozki-xhttp {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:10011;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================================================
        # gRPC
        # =====================================================

        location ~ ^/vless-grpc-virgozki/ {
            if ($content_type !~ "application/grpc") {
                return 404;
            }

            client_max_body_size 0;

            grpc_pass grpc://127.0.0.1:10012;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/vmess-grpc-virgozki/ {
            if ($content_type !~ "application/grpc") {
                return 404;
            }

            client_max_body_size 0;

            grpc_pass grpc://127.0.0.1:10013;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/trojan-grpc-virgozki/ {
            if ($content_type !~ "application/grpc") {
                return 404;
            }

            client_max_body_size 0;

            grpc_pass grpc://127.0.0.1:10014;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/ss-grpc-virgozki/ {
            if ($content_type !~ "application/grpc") {
                return 404;
            }

            client_max_body_size 0;

            grpc_pass grpc://127.0.0.1:10015;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        # =====================================================
        # ROOT PAGE
        # =====================================================

        location / {
            root /usr/local/openresty/nginx/html;
            index index.html;
        }
    }
}
